{% set version = "1.6.0" %}

package:
  name: fqdn
  version: {{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/f/fqdn/fqdn-{{ version }}.tar.gz
    sha256: e39bf62e2a9481aa2cb780554fdfd944dd8ee5f230eb831684d539cbafed8de2
    folder: dist
  - url: https://github.com/ypcrts/fqdn/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 6a6374075ad9417368f9f702ceec698cceb41b3ab8202ebc6c3ff03c774e1e73
    folder: src

build:
  number: 0
  noarch: python
  script: cd dist && {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    # technically only for py<38, not worth extra builds
    - cached-property >=1.3.0
    - python >={{ python_min }},<4

test:
  source_files:
    - src/tests
  imports:
    - fqdn
  commands:
    - pip check
    - cd src/tests && pytest --cov=fqdn --cov-report=term-missing:skip-covered --no-cov-on-fail --cov-fail-under=95
  requires:
    - pip
    - pytest-cov
    - python {{ python_min }}

about:
  home: https://github.com/ypcrts/fqdn
  summary: Validates fully-qualified domain names against RFC 1123, so that they are acceptable to modern bowsers
  license: MPL-2.0
  license_file: src/LICENSE

extra:
  recipe-maintainers:
    - bollwyvl
